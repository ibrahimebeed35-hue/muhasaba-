<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>محاسبتي — يومكِ مع الله</title>
<meta name="theme-color" content="#C7A87B">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="./main.css">
</head>
<body>
<div id="root"></div>
<script>window.instinctFile={initialRoute:"/",route:function(){},request:function(method,params){var P="mh-offline:";try{if(method==="local.read"){var v=localStorage.getItem(P+params.key);return Promise.resolve(v==null?{status:"memory"}:{status:"saved",value:v})}if(method==="local.write"){localStorage.setItem(P+params.key,params.value);return Promise.resolve({status:"saved"})}if(method==="context")return Promise.resolve({isOwnerUser:true})}catch(e){}return Promise.resolve({status:"unavailable"})}};</script>
<script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}</script>
<script src="./main.js"></script>
</body>
</html>
