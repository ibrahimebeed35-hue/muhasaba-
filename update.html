<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>تحديث التطبيق</title>
<style>body{background:#C7A87B;color:#2b1d0e;font-family:sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:2}</style>
</head>
<body><div><p id="m">جارٍ تحديث التطبيق… لحظات 🤍</p><p><small>بياناتكِ وعلاماتكِ لا تُمس، يحدّث هذا ملفات التطبيق فقط.</small></p></div>
<script>
(async function(){
  var m=document.getElementById('m');
  try{
    if('serviceWorker' in navigator){ var regs=await navigator.serviceWorker.getRegistrations(); for (var r of regs) await r.unregister(); }
    if('caches' in window){ var ks=await caches.keys(); for (var k of ks) await caches.delete(k); }
    m.textContent='تم التحديث — جارٍ فتح التطبيق…';
  }catch(err){ m.textContent='تعذّر التحديث التلقائي، سنحاول المتابعة…'; }
  setTimeout(function(){ location.replace('./?v='+Date.now()); }, 500);
})();
</script></body></html>
